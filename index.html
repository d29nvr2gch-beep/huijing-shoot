.me{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}

</style></head><body>
<div id="app">
<header><h1>会<b>镜</b>·拍摄执行</h1><span class="pill">云端协作版</span><span class="sp"></span><span class="live" id="live">● 实时</span></header>
<div class="sec me" id="me-bar"><span style="color:var(--muted);font-size:13px">我是：</span>

<div class="sec" id="view-done" style="display:none"></div>

<div class="sec" id="view-tasks" style="display:none"></div>
<div style="padding:20px 16px;text-align:center;font-size:11.5px;color:var(--muted)">会镜·拍摄执行 云端协作版 · 生成于 2026-08-20 22:46:29<br>操作自动写回云端，每20秒自动同步全场</div>
</div>
<div class="toast" id="toast"></div>
<script>
var PID=parseInt(new URLSearchParams(location.search).get('p')||'1')||1;
var PROGRESS_URL='https://xinhuo-1300523387.cos.ap-guangzhou.myqcloud.com/huijing-shoot/progress-'+PID+'.json';
var PUTURL_URL='https://xinhuo-1300523387.cos.ap-guangzhou.myqcloud.com/huijing-shoot/puturl-'+PID+'.json';
var state={plan:[],tasks:[],takes:[],members:[]}, putUrl=null, ME=null, VIEW='home', busy=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},2600);}
function saveMe(){
  var n=document.getElementById('me-name').value.trim(), r=document.getElementById('me-role').value;
  if(!n){toast('先输入昵称');return;}
  if((r==='导演'||r==='场记'||r==='摄影')&&localStorage.getItem('hjcloud_ok')!=='1'){
    var pw=prompt('🔒 导演/场记操作需要口令：');
    if(pw!=='Mm944714'){toast('❌ 口令错误');return;}
    try{localStorage.setItem('hjcloud_ok','1');}catch(e){}
    toast('🔓 口令验证通过');
  }
  ME={name:n,role:r};
  try{localStorage.setItem('hjcloud_me',JSON.stringify(ME));}catch(e){}
  render();toast('已进入：'+n+(r?'（'+r+'）':''));
}
function showTab(v,el){
  VIEW=v;
  ['home','plan','done','mat','tasks'].forEach(function(k){
    var d=document.getElementById('view-'+k);
    if(d)d.style.display=(k===v)?'block':'none';
  });
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
  el.classList.add('on');render();
}
function isDir(){return ME&&ME.role==='导演';}
function canOp(){return ME&&(ME.role==='导演'||ME.role==='场记');}
function canMedia(){return ME&&(ME.role==='导演'||ME.role==='场记'||ME.role==='摄影');}
function loadState(){
  return fetch(PROGRESS_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    if(d.version!=='63v4'){toast('⚠️ 页面是旧版本，请刷新（右上角···→刷新）');return;}
    state=d;render();
  }).catch(function(){});
}
function loadPut(){
  return fetch(PUTURL_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){putUrl=d.put;}).catch(function(){});
}
function save(){
  if(busy)return;
  if(state.version!=='63v4'){toast('⚠️ 页面过期，先刷新再操作');return;}
  if(!putUrl){toast('写回通道未就绪');return;}
  busy=true;
  state.updated=new Date().toISOString();
  fetch(putUrl,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}).then(function(r){
    busy=false;
    if(r.ok){toast('☁️ 已写回云端');render();}
    else toast('写回失败，稍后重试');
  }).catch(function(){busy=false;toast('网络异常，写回失败');});
}
function setStatus(id,st){
  var it=state.plan.find(function(x){return x.id===id;});
  if(!it)return;
  if(st==='开拍'){
    state.plan.forEach(function(x){if(x.status==='开拍')x.status='待拍';});
  }
  it.status=st;save();
}
function doTake(){
  if(!canOp()){toast('只有导演/场记可以打板');return;}
  var cur=state.plan.filter(function(x){return x.status==='开拍';})[0];
  var takeNo=(state.takes.length||0)+1, soundNo=takeNo;
  var t={id:Date.now(),take_no:takeNo,sound_no:soundNo,shot_no:cur?cur.shot_no:'',created_at:new Date().toLocaleTimeString('zh-CN',{hour12:false}),by:ME?ME.name:''};
  state.takes.push(t);
  beep();save();
  toast('🎬 打板 T'+takeNo+' S'+soundNo+(cur?' · '+cur.shot_no:''));
}
function beep(){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var dur=0.09, buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.18));
    var src=ctx.createBufferSource();src.buffer=buf;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
    src.connect(lp);lp.connect(ctx.destination);src.start();
  }catch(e){}
}
function stColor(s){return{待拍:'#565e6e',开拍:'#e8c77f',完成:'#5fbf7a',NG:'#e06c6c',素材:'#6fa8dc'}[s]||'#565e6e';}
function stLabel(s){return s==='素材'?'📦 素材':s;}
function imgHTML(shotNo, imgs){
  var list=(imgs&&imgs.length)?imgs:(function(){
    var m=String(shotNo||'').match(/镜(\d+)/);
    return m?['https://xinhuo-1300523387.cos.ap-guangzhou.myqcloud.com/huijing-shoot/shots/镜'+('00'+m[1]).slice(-2)+'.jpg']:[];
  })();
  if(!list.length)return '';
  if(list.length===1){
    return '<img class="shot-img" src="'+esc(list[0])+'" onclick="window.open(\''+esc(list[0])+'\')">';
  }
  return '<div class="shot-imgs">'+list.map(function(u){
    return '<img src="'+esc(u)+'" onclick="window.open(\''+esc(u)+'\')">';
  }).join('')+'</div>';
}
function mediaHTML(x){
  var m=x.media||[];
  if(!m.length)return '';
  return '<div class="tl" style="margin-top:6px;color:#8fd0ff">🎥 '+m.map(function(r){
    return esc(r.cam||'')+'机:'+esc(r.video||'—')+(r.audio?'/🎙'+esc(r.audio):'');
  }).join('　')+'</div>';
}
function editMedia(id){
  if(!canMedia()){toast('只有导演/场记/摄影可录素材编号');return;}
  var it=state.plan.find(function(x){return x.id===id;});
  if(!it)return;
  var m=(it.media||[]).slice();
  while(m.length<1)m.push({cam:'A',video:'',audio:''});
  var html='<div class="mask" id="md-mask" onclick="if(event.target===this)this.remove()"><div class="box" style="max-width:340px">'
    +'<h3 style="margin-bottom:8px">🎥 素材编号 · '+esc(it.shot_no)+'</h3>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">机位数：'
    +'<select id="md-cams" onchange="mdRows()"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>'
    +'<span style="font-size:11.5px;color:var(--muted)">几个机位录几次</span></div>'
    +'<div id="md-rows"></div>'
    +'<button class="btn primary big" style="width:100%;margin-top:10px" onclick="mdSave('+id+')">保存编号</button>'
    +'<button class="btn big" style="width:100%;margin-top:6px" onclick="document.getElementById(\'md-mask\').remove()">取消</button>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
  var sel=document.getElementById('md-cams');
  sel.value=String(Math.max(1,m.length));
  mdRows(m);
}
function mdRows(init){
  var rows=document.getElementById('md-rows');if(!rows)return;
  var n=parseInt(document.getElementById('md-cams').value||'1');
  var m=init||[];
  while(m.length<n)m.push({cam:String.fromCharCode(65+m.length),video:'',audio:''});
  m=m.slice(0,n);
  rows.innerHTML=m.map(function(r,i){
    return '<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">'
      +'<span class="tg">'+esc(r.cam)+'机</span>'
      +'<input placeholder="视频编号 如A001" value="'+esc(r.video||'')+'" style="flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 8px;font-size:12.5px" data-v="'+i+'">'
      +'<input placeholder="音频编号 如S01" value="'+esc(r.audio||'')+'" style="flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 8px;font-size:12.5px" data-a="'+i+'">'
      +'</div>';
  }).join('');
  window._md= m;
}
function mdSave(id){
  var it=state.plan.find(function(x){return x.id===id;});
  if(!it)return;
  var n=parseInt(document.getElementById('md-cams').value||'1');
  var m=[];
  for(var i=0;i<n;i++){
    var v=document.querySelector('#md-rows input[data-v="'+i+'"]');
    var a=document.querySelector('#md-rows input[data-a="'+i+'"]');
    if(!v)continue;
    var video=(v.value||'').trim(), audio=(a?a.value||'':'').trim();
    if(video||audio)m.push({cam:String.fromCharCode(65+i),video:video,audio:audio});
  }
  it.media=m;
  document.getElementById('md-mask').remove();
  save();
  toast('🎥 素材编号已记录'+(m.length?('（'+m.length+'机位）'):'（已清空）'));
}
function copyMatList(){
  var mats=state.plan.filter(function(x){return x.status==='素材';});
  if(!mats.length){toast('还没有素材镜头');return;}
  var txt='【素材清单】'+esc(state.name||'')+'\n共 '+mats.length+' 条\n\n'+mats.map(function(x,i){
    return (i+1)+'. '+x.shot_no+' '+x.shot_type+'：'+(x.content||'').split('\n')[0]+(x.dialogue?'\n   旁白：'+x.dialogue:'');
  }).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('📋 素材清单已复制，可直接粘贴到微信');});
  }else{
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('📋 素材清单已复制');}catch(e){toast('复制失败，长按选择复制');}
    document.body.removeChild(ta);
  }
}
function exportCSV(){
  var plan=state.plan||[];
  var rows=[['镜号','景别','状态','画面','旁白','拍摄条数']];
  plan.forEach(function(x){
    var n=(state.takes||[]).filter(function(t){return t.shot_no===x.shot_no;}).length;
    rows.push([x.shot_no,x.shot_type||'',x.status,(x.content||'').replace(/\n/g,' '),(x.dialogue||'').replace(/\n/g,' '),n]);
  });
  var csv='\ufeff'+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='拍摄场记.csv';a.click();
  toast('📥 场记CSV已下载');
}
function render(){
  if(!ME){return;}
  var plan=state.plan||[], tasks=state.tasks||[], takes=state.takes||[];
  var done=plan.filter(function(x){return x.status==='完成'||x.status==='素材';}).length;
  document.getElementById('done').textContent=done;
  document.getElementById('total').textContent=plan.length;
  document.getElementById('pbar').style.width=(plan.length?Math.round(done/plan.length*100):0)+'%';
  if(VIEW==='home')renderHome();
  else if(VIEW==='plan')renderPlan(plan);
  else if(VIEW==='done')renderDone(plan);
  else if(VIEW==='mat')renderMat(plan);
  else renderTasks(tasks);
}
function todayStr(){
  var d=new Date(),w=['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w;
}
function renderHome(){
  var plan=state.plan||[], tasks=state.tasks||[];
  var done=plan.filter(function(x){return x.status==='完成';}).length;
  var mat=plan.filter(function(x){return x.status==='素材';}).length;
  var todo=plan.length-done-mat;
  var pct=plan.length?Math.round((done+mat)/plan.length*100):0;
  var h='<div class="tl" style="margin-bottom:10px">📅 '+todayStr()+' · '+esc(ME.name)+'（'+esc(ME.role)+'）</div>'
    +'<div class="card" style="text-align:center;padding:16px">'
    +'<div style="font-size:30px;font-weight:800;color:var(--green)">'+done+'<span style="font-size:14px;color:var(--muted);font-weight:400"> 完成</span>'
    +'<span style="font-size:20px;color:var(--muted)"> / </span>'+mat+'<span style="font-size:14px;color:var(--muted);font-weight:400"> 素材</span>'
    +'<span style="font-size:20px;color:var(--muted)"> / </span>'+todo+'<span style="font-size:14px;color:var(--muted);font-weight:400"> 待拍</span></div>'
    +'<div class="progress-big" style="margin:10px 0"><div style="width:'+pct+'%"></div></div>'
    +'<div class="tl">总进度 '+pct+'%（'+plan.length+'镜）</div></div>';
  h+='<h3 style="margin:14px 0 8px">📋 今日通告单</h3>';
  if(!tasks.length)h+='<div class="empty">暂无排班</div>';
  tasks.forEach(function(t){
    h+='<div class="card" style="padding:11px 14px"><div class="th">'
      +'<span class="tg" style="color:var(--accent);font-weight:700">'+esc(t.time_slot)+'</span>'
      +(t.location?'<span class="tg">📍'+esc(t.location)+'</span>':'')
      +'</div><div class="pc" style="font-size:13.5px">'+esc(t.title)+'</div>'
      +((t.cast||[]).length?'<div class="tl">👤 '+esc((t.cast||[]).join('、'))+'</div>':'')
      +'</div>';
  });
  h+='<h3 style="margin:14px 0 8px">📝 脚本（只读）</h3>';
  var seen={}, segs=[];
  plan.forEach(function(x){
    var k=x.scene_no||'';
    if(k&&!seen[k]){seen[k]=1;segs.push(x);}
  });
  segs.sort(function(a,b){return (a.scene_no||'').localeCompare(b.scene_no||'',undefined,{numeric:true});});
  if(!segs.length){h+='<div class="empty">暂无脚本</div>';}
  segs.forEach(function(x){
    h+='<div class="card" style="padding:11px 14px"><div class="th"><span class="tg">'+esc(x.scene_no||x.shot_no)+'</span>'
      +'<span class="tg">'+esc(x.shot_type||'')+'</span></div>'
      +'<div class="pc" style="font-size:13.5px">'+esc(x.content||'')+'</div>'
      +(x.dialogue?'<div class="pd" style="background:rgba(232,199,127,.08);border-left:3px solid var(--accent);padding:6px 8px;border-radius:6px;margin-top:6px">🎙 '+esc(x.dialogue)+'</div>':'')
      +'</div>';
  });
  document.getElementById('view-home').innerHTML=h;
}
function renderPlan(plan){
  var todo=plan.filter(function(x){return x.status!=='完成'&&x.status!=='素材';});
  var h='';
  if(!canOp())h+='<div class="tl" style="margin-bottom:10px">👀 只读模式：导演/场记身份可操作勾选</div>';
  h+='<div class="tl" style="margin-bottom:10px">🎯 待拍摄 '+todo.length+' 镜 · 已完成 '+plan.filter(function(x){return x.status==='完成';}).length+' 镜 · 📦素材 '+plan.filter(function(x){return x.status==='素材';}).length+' 镜</div>';
  todo.forEach(function(x){
    var sc=stColor(x.status);
    h+='<div class="card pl" style="border-left:4px solid '+sc+'">'
      +imgHTML(x.shot_no,x.images)
      +'<div class="th" style="margin-top:10px">'
      +'<span class="tg">'+esc(x.shot_no)+'</span><span class="tg">'+esc(x.shot_type||'')+'</span>'
      +'<span class="tg" style="color:'+sc+';font-weight:700;border-color:'+sc+'">'+stLabel(x.status)+'</span>'
      +(canMedia()?'<button class="btn" style="padding:3px 10px;font-size:12px;margin-left:auto" onclick="editMedia('+x.id+')">🎥 编号</button>':'')
      +(canOp()?'<button class="btn" style="padding:3px 10px;font-size:12px" onclick="setStatus('+x.id+',\'素材\')">📦 标素材</button>':'')
      +'</div>'
      +'<div class="pc">'+esc(x.content)+'</div>'
      +mediaHTML(x)
      +(x.dialogue?'<div class="pd" style="background:rgba(232,199,127,.08);border-left:3px solid var(--accent);padding:6px 8px;border-radius:6px;margin-top:6px">🎙 '+esc(x.dialogue)+'</div>':'');
    if(canOp()){
      h+='<div class="ops">'
        +(x.status==='开拍'?'<button class="btn yellow" onclick="setStatus('+x.id+',\'待拍\')">⏹ 停拍</button>'
          :'<button class="btn yellow" onclick="setStatus('+x.id+',\'开拍\')">🎬 开拍</button>')
        +'<button class="btn green" onclick="setStatus('+x.id+',\'完成\')">✓ 完成</button>'
        +'<button class="btn red" onclick="setStatus('+x.id+',\'NG\')">✗ NG</button>'
        +'</div>';
    }
    h+='</div>';
  });
  document.getElementById('view-plan').innerHTML=h||'<div class="empty">🎉 待拍摄已清空！去「✅ 已拍摄」和「📦 素材提供」查看归档</div>';
}
function renderMat(plan){
  var mats=plan.filter(function(x){return x.status==='素材';});
  var h='<div class="tl" style="margin-bottom:10px">📦 素材提供 '+mats.length+' 镜（用素材剪辑的镜头都在这里；「✓ 完成」=素材已提供）</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn" style="flex:1" onclick="copyMatList()">📋 复制素材清单</button></div>';
  mats.forEach(function(x){
    h+='<div class="card" style="border-left:4px solid #6fa8dc">'
      +imgHTML(x.shot_no,x.images)
      +'<div class="th" style="margin-top:10px">'
      +'<span class="tg">'+esc(x.shot_no)+'</span><span class="tg">'+esc(x.shot_type||'')+'</span>'
      +'<span class="tg" style="color:#6fa8dc;font-weight:700;border-color:#6fa8dc">📦 素材</span>'
      +'</div>'
      +'<div class="pc">'+esc(x.content)+'</div>'
      +mediaHTML(x)
      +(x.dialogue?'<div class="pd" style="background:rgba(111,168,220,.08);border-left:3px solid #6fa8dc;padding:6px 8px;border-radius:6px;margin-top:6px">🎙 '+esc(x.dialogue)+'</div>':'');
    var opsB='';
    if(canMedia())opsB+='<button class="btn" style="background:#0d1117;border:1px solid var(--line)" onclick="editMedia('+x.id+')">🎥 素材编号</button>';
    if(canOp())opsB+='<button class="btn green" onclick="setStatus('+x.id+',\'完成\')">✓ 素材已提供</button><button class="btn" style="background:#0d1117;border:1px solid var(--line)" onclick="setStatus('+x.id+',\'待拍\')">↩ 改拍摄</button>';
    if(opsB)h+='<div class="ops">'+opsB+'</div>';
    h+='</div>';
  });
  document.getElementById('view-mat').innerHTML=h||'<div class="empty">还没有素材镜头——在「🎬 待拍摄」里点「📦 标素材」就会移到这里</div>';
}
function renderDone(plan){
  var done=plan.filter(function(x){return x.status==='完成';});
  var h='<div class="tl" style="margin-bottom:10px">✅ 已拍摄 '+done.length+' 镜（「↩ 撤回」可回到待拍摄）</div>';
  done.forEach(function(x){
    var isMat=x.status==='素材';
    var sc=isMat?'#6fa8dc':'#5fbf7a';
    h+='<div class="card" style="border-left:4px solid '+sc+';opacity:.92">'
      +imgHTML(x.shot_no,x.images)
      +'<div class="th" style="margin-top:10px">'
      +'<span class="tg">'+esc(x.shot_no)+'</span><span class="tg">'+esc(x.shot_type||'')+'</span>'
      +'<span class="tg" style="color:'+sc+';font-weight:700;border-color:'+sc+'">'+(isMat?'📦 素材':'完成')+'</span>'
      +'</div>'
      +'<div class="pc">'+esc(x.content)+'</div>'
      +mediaHTML(x)
      +(x.dialogue?'<div class="pd" style="background:rgba(95,191,122,.08);border-left:3px solid '+sc+';padding:6px 8px;border-radius:6px;margin-top:6px">🎙 '+esc(x.dialogue)+'</div>':'')
      +(canMedia()?'<div class="ops"><button class="btn" style="background:#0d1117;border:1px solid var(--line)" onclick="editMedia('+x.id+')">🎥 素材编号</button><button class="btn" style="flex:1;padding:12px 2px;font-size:15px;border-radius:10px;font-weight:700;border:none;background:var(--card);color:var(--muted);border:1px solid var(--line)" onclick="setStatus('+x.id+',\'待拍\')">↩ 撤回</button></div>':'')
      +(canOp()&&!canMedia()?'<div class="ops"><button class="btn" style="flex:1;padding:12px 2px;font-size:15px;border-radius:10px;font-weight:700;border:none;background:var(--card);color:var(--muted);border:1px solid var(--line)" onclick="setStatus('+x.id+',\'待拍\')">↩ 撤回</button></div>':'')
      +'</div>';
  });
  document.getElementById('view-done').innerHTML=h||'<div class="empty">还没有已归档的镜头</div>';
}
function renderTasks(tasks){
  var h='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn" style="font-size:12.5px" onclick="showTab(\'plan\',document.querySelectorAll(\'.tab\')[0])">→ 去待拍摄勾选</button><span class="tl">任务状态由组内镜头自动联动</span></div>';
  if(!tasks.length){h+='<div class="empty">还没有任务清单</div>';}
  tasks.forEach(function(t){
    var gd=t.shots.filter(function(s){return s.status==='完成';}).length;
    var st=t.shots.length&&gd===t.shots.length?'完成':(t.shots.some(function(s){return s.status==='开拍';})?'进行中':'待拍');
    var sc={待拍:'#565e6e',进行中:'#e8c77f',完成:'#5fbf7a'}[st]||'#565e6e';
    var pct=Math.round(gd/t.shots.length*100);
    h+='<div class="card" style="border-left:4px solid '+sc+'"><div class="th"><span class="tg">任务'+t.group_no+'</span><span class="tg">'+esc(t.time_slot)+'</span><span class="tg" style="color:'+sc+'">'+st+'</span><span class="tm">约'+(t.est_minutes||0)+'分</span></div>'
      +'<h3>'+esc(t.title)+'</h3>'
      +(t.location?'<div class="tl">📍 '+esc(t.location)+'</div>':'')
      +((t.cast||[]).length?'<div class="tl">👤 '+esc((t.cast||[]).join('、'))+'</div>':'')
      +(t.wardrobe?'<div class="tl">💄 '+esc(t.wardrobe)+'</div>':'')
      +(t.props?'<div class="tl">🎭 '+esc(t.props)+'</div>':'')
      +'<div class="bar"><div style="width:'+pct+'%"></div></div>'
      +'<div class="tl">'+gd+'/'+t.shots.length+' 镜：'+t.shots.map(function(s){return '<span class="tg" style="border-color:'+stColor(s.status)+'">'+esc(s.shot_no)+'</span>';}).join(' ')+'</div></div>';
  });
  document.getElementById('view-tasks').innerHTML=h;
}
function renderSlate(plan,takes){
  var cur=plan.filter(function(x){return x.status==='开拍';})[0];
  var last=takes[takes.length-1];
  var h='<div class="slate"><div class="lbl">当前拍摄</div><div class="num">'+esc(cur?cur.shot_no:'—')+'</div>'
    +'<div class="lbl">'+esc(cur?(cur.shot_type||'')+' · '+esc(cur.content.slice(0,30)):'暂无开拍镜头，去执行计划点「🎬 开拍」')+'</div>'
    +'<div class="rows"><div class="item"><div class="num" style="color:var(--accent)">T'+(last?last.take_no:(takes.length+1))+'</div><div class="lbl">拍摄编号</div></div>'
    +'<div class="item"><div class="num" style="color:var(--accent)">S'+(last?last.sound_no:(takes.length+1))+'</div><div class="lbl">声音编号</div></div></div>'
    +(canOp()?'<button onclick="doTake()">🎬 打板</button><div class="lbl" style="margin-top:8px">打板声 + 自动记录拍号声号</div>':'<div class="lbl">👀 只读（导演/场记可打板）</div>')
    +'</div><h3 style="margin:18px 0 8px">📼 场记记录（'+takes.length+'）</h3>';
  if(!takes.length)h+='<div class="empty">还没有打板记录</div>';
  takes.slice().reverse().slice(0,20).forEach(function(t){
    h+='<div class="card" style="padding:10px 14px"><div class="th"><span class="tg" style="color:var(--accent)">T'+t.take_no+' S'+t.sound_no+'</span><span class="tg">'+esc(t.shot_no||'')+'</span><span class="sp"></span><span class="tm">'+esc(t.created_at||'')+(t.by?' · '+esc(t.by):'')+'</span></div></div>';
  });
  document.getElementById('view-slate').innerHTML=h;
}
// 初始化
(function(){
  try{var m=JSON.parse(localStorage.getItem('hjcloud_me')||'null');if(m&&m.name)ME=m;}catch(e){}
  if(ME){document.getElementById('me-name').value=ME.name;document.getElementById('me-role').value=ME.role||'';}
  loadPut().then(loadState);
  setInterval(loadState,20000);
})();
</script>
</body></html>
