<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会镜·拍摄执行 · 《方寸窗口·无界长宁》长宁出入境30周年（63镜·含参考图）（协作版）</title><style>
:root{--bg:#0e1116;--card:#171c24;--line:#252c38;--text:#e8ecf3;--muted:#8b93a3;--accent:#e8c77f;--green:#5fbf7a;--red:#e06c6c}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC',sans-serif;font-size:15px}
#app{max-width:720px;margin:0 auto;padding:0 16px 60px}
header{position:sticky;top:0;background:rgba(14,17,22,.96);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:50;flex-wrap:wrap}
header h1{font-size:17px;font-weight:700}header h1 b{color:var(--accent)}header .sp{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted)}
.live{color:var(--green);font-size:11.5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.tabs{display:flex;gap:6px;padding:10px 16px 4px}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13.5px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--accent);color:#1a1408;font-weight:700;border-color:var(--accent)}
.sec{padding:10px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:6px}.th{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.tg{font-size:12px;padding:3px 8px;border-radius:6px;background:#0d1117;border:1px solid var(--line);color:var(--muted)}
.tl{font-size:12.5px;color:var(--muted);margin-top:4px}.tm{margin-left:auto;font-size:12px;color:var(--muted)}
.bar{height:5px;background:#0d1117;border-radius:3px;margin:10px 0}.bar div{height:5px;background:var(--accent);border-radius:3px;transition:width .5s}
.pc{font-size:14px;line-height:1.55}.pd{font-size:13px;color:var(--muted);margin-top:4px}.pl{border-left:4px solid var(--line)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1408;font-weight:700}
.btn.big{padding:11px 16px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:wait}
.btn.green{background:var(--green);border-color:var(--green);color:#08130b}
.btn.red{background:var(--red);border-color:var(--red);color:#1a0808}
.btn.yellow{background:#e8c77f;border-color:#e8c77f;color:#1a1408}
.progress-big{height:10px;background:#0d1117;border-radius:5px;margin:12px 0;overflow:hidden}.progress-big div{height:10px;background:var(--green);border-radius:5px;transition:width .5s}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.slate{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.slate .num{font-size:34px;font-weight:800;letter-spacing:1px}
.slate .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.slate .rows{display:flex;gap:12px;justify-content:center;margin:14px 0}
.slate .rows .item{flex:1;max-width:150px}
.slate button{width:100%;padding:18px;font-size:20px;border-radius:14px;border:none;cursor:pointer;background:var(--accent);color:#1a1408;font-weight:800}
.slate button:active{transform:scale(.97)}
.me{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}
.me select,.me input{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px}
.role-chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.role-chip.on{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#232b38;border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;display:none;max-width:90vw}
</style></head><body>
<div id="app">
<header><h1>会<b>镜</b>·拍摄执行</h1><span class="pill">云端协作版</span><span class="sp"></span><span class="live" id="live">● 实时</span></header>
<div class="sec me" id="me-bar"><span style="color:var(--muted);font-size:13px">我是：</span>
<input id="me-name" placeholder="昵称" style="width:110px">
<select id="me-role"><option value="">—选工种—</option><option>导演</option><option>场记</option><option>摄影</option><option>灯光</option><option>妆造</option><option>道具</option><option>后期</option><option>甲方</option></select>
<button class="btn primary" onclick="saveMe()">进入</button>
<span style="font-size:12px;color:var(--muted)">（已进入可点右上角刷新身份）</span></div>
<div class="sec" style="display:flex;align-items:center;gap:10px">
<div class="pill" style="flex:1">进度 <b style="color:var(--green)" id="done">0</b>/<span id="total">0</span> 镜</div>
</div>
<div class="progress-big" style="margin:0 16px"><div id="pbar" style="width:0%"></div></div>
<div class="tabs">
<div class="tab on" onclick="showTab('plan',this)">📋 执行计划</div>
<div class="tab" onclick="showTab('done',this)">✅ 已拍摄</div>
<div class="tab" onclick="showTab('tasks',this)">📅 任务清单</div>
<div class="tab" onclick="showTab('slate',this)">🎬 场记板</div>
</div>
<div class="sec" id="view-plan"></div>
<div class="sec" id="view-done" style="display:none"></div>
<div class="sec" id="view-tasks" style="display:none"></div>
<div class="sec" id="view-slate" style="display:none"></div>
<div style="padding:20px 16px;text-align:center;font-size:11.5px;color:var(--muted)">会镜·拍摄执行 云端协作版 · 生成于 2026-08-20 13:53:18<br>操作自动写回云端，每20秒自动同步全场</div>
</div>
<div class="toast" id="toast"></div>
<script>
var PID=parseInt(new URLSearchParams(location.search).get('p')||'1')||1;
var PROGRESS_URL='https://xinhuo-1300523387.cos.ap-guangzhou.myqcloud.com/huijing-shoot/progress-'+PID+'.json';
var PUTURL_URL='https://xinhuo-1300523387.cos.ap-guangzhou.myqcloud.com/huijing-shoot/puturl-'+PID+'.json';
var state={plan:[],tasks:[],takes:[],members:[]}, putUrl=null, ME=null, VIEW='plan', busy=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},2600);}
function saveMe(){
  var n=document.getElementById('me-name').value.trim(), r=document.getElementById('me-role').value;
  if(!n){toast('先输入昵称');return;}
  ME={name:n,role:r};
  try{localStorage.setItem('hjcloud_me',JSON.stringify(ME));}catch(e){}
  render();toast('已进入：'+n+(r?'（'+r+'）':''));
}
function showTab(v,el){
  VIEW=v;
  ['plan','done','tasks','slate'].forEach(function(k){
    var d=document.getElementById('view-'+k);
    if(d)d.style.display=(k===v)?'block':'none';
  });
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
  el.classList.add('on');render();
}
function isDir(){return ME&&ME.role==='导演';}
function canOp(){return ME&&(ME.role==='导演'||ME.role==='场记');}
function loadState(){
  return fetch(PROGRESS_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){state=d;render();}).catch(function(){});
}
function loadPut(){
  return fetch(PUTURL_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){putUrl=d.put;}).catch(function(){});
}
function save(){
  if(busy)return;
  if(!putUrl){toast('写回通道未就绪');return;}
  busy=true;
  state.updated=new Date().toISOString();
  fetch(putUrl,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}).then(function(r){
    busy=false;
    if(r.ok){toast('☁️ 已写回云端');render();}
    else toast('写回失败，稍后重试');
  }).catch(function(){busy=false;toast('网络异常，写回失败');});
}
function setStatus(id,st){
  var it=state.plan.find(function(x){return x.id===id;});
  if(!it)return;
  if(st==='开拍'){
    state.plan.forEach(function(x){if(x.status==='开拍')x.status='待拍';});
  }
  it.status=st;save();
}
function doTake(){
  if(!canOp()){toast('只有导演/场记可以打板');return;}
  var cur=state.plan.filter(function(x){return x.status==='开拍';})[0];
  var takeNo=(state.takes.length||0)+1, soundNo=takeNo;
  var t={id:Date.now(),take_no:takeNo,sound_no:soundNo,shot_no:cur?cur.shot_no:'',created_at:new Date().toLocaleTimeString('zh-CN',{hour12:false}),by:ME?ME.name:''};
  state.takes.push(t);
  beep();save();
  toast('🎬 打板 T'+takeNo+' S'+soundNo+(cur?' · '+cur.shot_no:''));
}
function beep(){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var dur=0.09, buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.18));
    var src=ctx.createBufferSource();src.buffer=buf;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
    src.connect(lp);lp.connect(ctx.destination);src.start();
  }catch(e){}
}
function stColor(s){return{待拍:'#565e6e',开拍:'#e8c77f',完成:'#5fbf7a',NG:'#e06c6c'}[s]||'#565e6e';}
function imgHTML(shotNo){
  var m=String(shotNo||'').match(/镜(\d+)/);
  if(!m)return '';
  var n=('00'+m[1]).slice(-2);
  return '<img src="https://xinhuo-1300523387.cos.ap-guangzhou.myqcloud.com/huijing-shoot/shots/镜'+n+'.jpg" alt="'+esc(shotNo)+'" style="width:100%;border-radius:8px;margin-top:8px;aspect-ratio:16/9;object-fit:cover;background:#1a1f2a" loading="lazy">';
}
function render(){
  if(!ME){return;}
  var plan=state.plan||[], tasks=state.tasks||[], takes=state.takes||[];
  var done=plan.filter(function(x){return x.status==='完成';}).length;
  document.getElementById('done').textContent=done;
  document.getElementById('total').textContent=plan.length;
  document.getElementById('pbar').style.width=(plan.length?Math.round(done/plan.length*100):0)+'%';
  if(VIEW==='plan')renderPlan(plan);
  else if(VIEW==='done')renderDone(plan);
  else if(VIEW==='tasks')renderTasks(tasks);
  else renderSlate(plan,takes);
}
function renderPlan(plan){
  var todo=plan.filter(function(x){return x.status!=='完成';});
  var h='';
  if(!canOp())h+='<div class="tl" style="margin-bottom:10px">👀 只读模式：导演/场记身份可操作勾选</div>';
  h+='<div class="tl" style="margin-bottom:10px">🎯 待拍 '+todo.length+' 镜 · 已完成 '+plan.filter(function(x){return x.status==='完成';}).length+' 镜已归档到「✅ 已拍摄」</div>';
  todo.forEach(function(x){
    var sc=stColor(x.status);
    h+='<div class="card pl" style="border-left:4px solid '+sc+'"><div class="th">'
      +'<span class="tg">'+esc(x.shot_no)+'</span><span class="tg">'+esc(x.shot_type||'')+'</span>'
      +'<span class="tg" style="color:'+sc+';font-weight:700">'+esc(x.status)+'</span><span class="sp"></span>';
    if(canOp()){
      if(x.status!=='开拍')h+='<button class="btn yellow" style="padding:5px 10px;font-size:12px" onclick="setStatus('+x.id+',\'开拍\')">🎬 开拍</button>';
      h+='<button class="btn green" style="padding:5px 10px;font-size:12px" onclick="setStatus('+x.id+',\'完成\')">✓ 完成</button>'
        +'<button class="btn red" style="padding:5px 10px;font-size:12px" onclick="setStatus('+x.id+',\'NG\')">✗ NG</button>';
    }
    h+='</div><div class="pc">'+esc(x.content)+'</div>'
      +(x.dialogue?'<div class="pd">🎙 '+esc(x.dialogue)+'</div>':'')
      +imgHTML(x.shot_no)+'</div>';
  });
  document.getElementById('view-plan').innerHTML=h||'<div class="empty">🎉 全部拍完！去「✅ 已拍摄」查看归档</div>';
}
function renderDone(plan){
  var done=plan.filter(function(x){return x.status==='完成';});
  var h='<div class="tl" style="margin-bottom:10px">✅ 已拍摄 '+done.length+' 镜（点击「↩ 撤回」可回到执行计划）</div>';
  done.forEach(function(x){
    h+='<div class="card" style="border-left:4px solid #5fbf7a;opacity:.92"><div class="th">'
      +'<span class="tg">'+esc(x.shot_no)+'</span><span class="tg">'+esc(x.shot_type||'')+'</span>'
      +'<span class="tg" style="color:#5fbf7a;font-weight:700">完成</span><span class="sp"></span>'
      +(canOp()?'<button class="btn" style="padding:5px 10px;font-size:12px" onclick="setStatus('+x.id+',\'待拍\')">↩ 撤回</button>':'')
      +'</div><div class="pc">'+esc(x.content)+'</div>'+imgHTML(x.shot_no)+'</div>';
  });
  document.getElementById('view-done').innerHTML=h||'<div class="empty">还没有已拍摄的镜头</div>';
}
function renderTasks(tasks){
  var h='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn" style="font-size:12.5px" onclick="showTab(\'plan\',document.querySelectorAll(\'.tab\')[0])">→ 去执行计划勾选</button><span class="tl">任务状态由组内镜头自动联动</span></div>';
  if(!tasks.length){h+='<div class="empty">还没有任务清单</div>';}
  tasks.forEach(function(t){
    var gd=t.shots.filter(function(s){return s.status==='完成';}).length;
    var st=t.shots.length&&gd===t.shots.length?'完成':(t.shots.some(function(s){return s.status==='开拍';})?'进行中':'待拍');
    var sc={待拍:'#565e6e',进行中:'#e8c77f',完成:'#5fbf7a'}[st]||'#565e6e';
    var pct=Math.round(gd/t.shots.length*100);
    h+='<div class="card" style="border-left:4px solid '+sc+'"><div class="th"><span class="tg">任务'+t.group_no+'</span><span class="tg">'+esc(t.time_slot)+'</span><span class="tg" style="color:'+sc+'">'+st+'</span><span class="tm">约'+(t.est_minutes||0)+'分</span></div>'
      +'<h3>'+esc(t.title)+'</h3>'
      +(t.location?'<div class="tl">📍 '+esc(t.location)+'</div>':'')
      +((t.cast||[]).length?'<div class="tl">👤 '+esc((t.cast||[]).join('、'))+'</div>':'')
      +(t.wardrobe?'<div class="tl">💄 '+esc(t.wardrobe)+'</div>':'')
      +(t.props?'<div class="tl">🎭 '+esc(t.props)+'</div>':'')
      +'<div class="bar"><div style="width:'+pct+'%"></div></div>'
      +'<div class="tl">'+gd+'/'+t.shots.length+' 镜：'+t.shots.map(function(s){return '<span class="tg" style="border-color:'+stColor(s.status)+'">'+esc(s.shot_no)+'</span>';}).join(' ')+'</div></div>';
  });
  document.getElementById('view-tasks').innerHTML=h;
}
function renderSlate(plan,takes){
  var cur=plan.filter(function(x){return x.status==='开拍';})[0];
  var last=takes[takes.length-1];
  var h='<div class="slate"><div class="lbl">当前拍摄</div><div class="num">'+esc(cur?cur.shot_no:'—')+'</div>'
    +'<div class="lbl">'+esc(cur?(cur.shot_type||'')+' · '+esc(cur.content.slice(0,30)):'暂无开拍镜头，去执行计划点「🎬 开拍」')+'</div>'
    +'<div class="rows"><div class="item"><div class="num" style="color:var(--accent)">T'+(last?last.take_no:(takes.length+1))+'</div><div class="lbl">拍摄编号</div></div>'
    +'<div class="item"><div class="num" style="color:var(--accent)">S'+(last?last.sound_no:(takes.length+1))+'</div><div class="lbl">声音编号</div></div></div>'
    +(canOp()?'<button onclick="doTake()">🎬 打板</button><div class="lbl" style="margin-top:8px">打板声 + 自动记录拍号声号</div>':'<div class="lbl">👀 只读（导演/场记可打板）</div>')
    +'</div><h3 style="margin:18px 0 8px">📼 场记记录（'+takes.length+'）</h3>';
  if(!takes.length)h+='<div class="empty">还没有打板记录</div>';
  takes.slice().reverse().slice(0,20).forEach(function(t){
    h+='<div class="card" style="padding:10px 14px"><div class="th"><span class="tg" style="color:var(--accent)">T'+t.take_no+' S'+t.sound_no+'</span><span class="tg">'+esc(t.shot_no||'')+'</span><span class="sp"></span><span class="tm">'+esc(t.created_at||'')+(t.by?' · '+esc(t.by):'')+'</span></div></div>';
  });
  document.getElementById('view-slate').innerHTML=h;
}
// 初始化
(function(){
  try{var m=JSON.parse(localStorage.getItem('hjcloud_me')||'null');if(m&&m.name)ME=m;}catch(e){}
  if(ME){document.getElementById('me-name').value=ME.name;document.getElementById('me-role').value=ME.role||'';}
  loadPut().then(loadState);
  setInterval(loadState,20000);
})();
</script>
</body></html>
